name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected families
    runs-on: ubuntu-latest
    outputs:
      sans_qa: ${{ steps.changes.outputs.sans_qa }}
      mono_qa: ${{ steps.changes.outputs.mono_qa }}
      pixel_qa: ${{ steps.changes.outputs.pixel_qa }}
      mono_build: ${{ steps.changes.outputs.mono_build }}
      pixel_build: ${{ steps.changes.outputs.pixel_build }}
    steps:
      - name: Classify changed files
        id: changes
        uses: actions/github-script@v9
        with:
          script: |
            let names = [];
            if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
              names = files.map((file) => file.filename);
            }

            const full = context.eventName !== 'pull_request';
            const changed = (...patterns) => names.some((name) =>
              patterns.some((pattern) =>
                pattern.endsWith('/') ? name.startsWith(pattern) : name === pattern
              )
            );

            const sharedQa = changed(
              'Makefile',
              'requirements-checks.txt',
              'scripts/check_language_shaping.py',
              'scripts/rename_font_metadata.py'
            );
            const sharedBuild = changed(
              'Makefile',
              'requirements.in',
              'requirements.txt',
              'scripts/customize.py',
              'scripts/read-config.py',
              'scripts/rename_font_metadata.py'
            );

            const sansQa = full || sharedQa || changed(
              'fonts/NamcheShadowSans/',
              'packages/next/dist/fonts/namche-shadow-sans/',
              'sources/NamcheShadowSans.glyphspackage/',
              'sources/NamcheShadowSans-Italic.glyphspackage/',
              'sources/config-NamcheShadowSans.yaml',
              'scripts/build_sans_variable.py',
              'scripts/check_sans_variable.py',
              'scripts/finalize_glyphs_statics.py',
              'scripts/refresh_shaping_tables.py'
            );
            const monoQa = full || sharedQa || changed(
              'fonts/NamcheShadowMono/',
              'packages/next/dist/fonts/namche-shadow-mono/',
              'sources/NamcheShadowMono.glyphspackage/',
              'sources/NamcheShadowMono-Italic.glyphspackage/',
              'sources/config-NamcheShadowMono.yaml',
              'scripts/check_mono_hmetrics.py'
            );
            const pixelQa = full || sharedQa || changed(
              'fonts/NamcheShadowPixel/',
              'packages/next/dist/fonts/namche-shadow-pixel/',
              'sources/NamcheShadowPixel.glyphspackage/',
              'sources/config-NamcheShadowPixel.yaml',
              'sources/compile-NamcheShadowPixelStatics.yaml',
              'scripts/check_pixel_ligature_carets.py',
              'scripts/check_pixel_rupee.py',
              'scripts/check_pixel_shaping.py',
              'scripts/check_pixel_separators.py',
              'scripts/finalize_pixel_statics.py'
            );
            const monoBuild = full || sharedBuild || changed(
              'sources/NamcheShadowMono.glyphspackage/',
              'sources/NamcheShadowMono-Italic.glyphspackage/',
              'sources/config-NamcheShadowMono.yaml'
            );
            const pixelBuild = full || sharedBuild || changed(
              'sources/NamcheShadowPixel.glyphspackage/',
              'sources/config-NamcheShadowPixel.yaml',
              'sources/compile-NamcheShadowPixelStatics.yaml',
              'scripts/finalize_pixel_statics.py'
            );

            for (const [key, value] of Object.entries({
              sans_qa: sansQa,
              mono_qa: monoQa,
              pixel_qa: pixelQa,
              mono_build: monoBuild,
              pixel_build: pixelBuild,
            })) {
              core.setOutput(key, value ? 'true' : 'false');
            }

  validate:
    name: Validate committed release fonts
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-checks.txt

      - name: Install check dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-checks.txt

      - name: Check vendored Geist webfonts against the upstream pin
        run: python scripts/vendor_geist.py --check

      - name: Generate Latin webfont subsets
        run: make subset-webfonts PYTHON=python

      - name: Test validation scripts
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Check source copies
        run: python scripts/check_source_copies.py

      # packages/next/dist/fonts is not committed; copy-npm-fonts populates it
      # from the committed fonts/ tree this job already validates. Without it the
      # generator has no faces to read and check:css dies on ENOENT.
      - name: Generate and stage npm webfont subsets
        # PYTHON defaults to venv/bin/python, which this job does not build.
        # The check dependencies installed above provide the same tooling to
        # the system interpreter, which the metadata check below already uses.
        run: make copy-npm-fonts PYTHON=python

      - name: Check generated webfont CSS
        working-directory: packages/next
        run: npm run check:css

      - name: Smoke test packed webfont CSS
        run: node scripts/check-packed-webfont-css.mjs

      - name: Check release metadata
        run: |
          python scripts/rename_font_metadata.py --check fonts
          python scripts/rename_font_metadata.py --check packages/next/dist/fonts

      - name: Check Sans variable release
        run: python scripts/check_sans_variable.py

      - name: Check Mono horizontal metrics
        run: python scripts/check_mono_hmetrics.py

      - name: Check Pixel release invariants
        run: |
          python scripts/check_pixel_separators.py
          python scripts/check_pixel_ligature_carets.py
          python scripts/check_pixel_rupee.py
          python scripts/check_pixel_shaping.py

      - name: Set up Fontspector
        if: >-
          github.event_name == 'pull_request' &&
          (needs.changes.outputs.sans_qa == 'true' ||
          needs.changes.outputs.mono_qa == 'true' ||
          needs.changes.outputs.pixel_qa == 'true')
        uses: fonttools/setup-fontspector@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Sans Fontspector baseline
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.outputs.sans_qa == 'true'
        run: make fontspector-sans

      - name: Check Sans language shaping
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.outputs.sans_qa == 'true'
        run: make check-language-shaping-sans

      - name: Run Mono Fontspector baseline
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.outputs.mono_qa == 'true'
        run: make fontspector-mono

      - name: Check Mono language shaping
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.outputs.mono_qa == 'true'
        run: make check-language-shaping-mono

      - name: Run Pixel Fontspector baseline
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.outputs.pixel_qa == 'true'
        run: make fontspector-pixel

      - name: Check Pixel mark shaping
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.outputs.pixel_qa == 'true'
        run: python scripts/check_pixel_shaping.py --fontspector-report out/fontspector/NamcheShadowPixel-fontspector-report.json

  rebuild-mono:
    name: Rebuild changed Mono source
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.mono_build == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: fonttools/setup-fontspector@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install build toolset
        run: |
          sudo apt-get update
          sudo apt-get install ttfautohint libcairo2-dev python3-cairo-dev pkg-config python3-dev
      - name: Build Mono
        run: make build-mono
      - name: Validate rebuilt Mono
        run: |
          make copy-npm-fonts
          venv/bin/python scripts/rename_font_metadata.py --check fonts/NamcheShadowMono
          venv/bin/python scripts/check_mono_hmetrics.py
          make fontspector-mono
          make check-language-shaping-mono

  rebuild-pixel:
    name: Rebuild changed Pixel source
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.pixel_build == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            Makefile
      - uses: fonttools/setup-fontspector@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install build toolset
        run: |
          sudo apt-get update
          sudo apt-get install ttfautohint libcairo2-dev python3-cairo-dev pkg-config python3-dev
      - name: Build Pixel
        run: make build-pixel
      - name: Validate rebuilt Pixel
        run: |
          make copy-npm-fonts
          venv/bin/python scripts/rename_font_metadata.py --check fonts/NamcheShadowPixel
          venv/bin/python scripts/check_pixel_separators.py
          venv/bin/python scripts/check_pixel_ligature_carets.py
          venv/bin/python scripts/check_pixel_rupee.py
          make fontspector-pixel
          venv/bin/python scripts/check_pixel_shaping.py --fontspector-report out/fontspector/NamcheShadowPixel-fontspector-report.json

  required:
    name: Build and test
    if: always()
    needs:
      - validate
      - rebuild-mono
      - rebuild-pixel
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required CI results
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          MONO_RESULT: ${{ needs.rebuild-mono.result }}
          PIXEL_RESULT: ${{ needs.rebuild-pixel.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          case "$MONO_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$PIXEL_RESULT" in success|skipped) ;; *) exit 1 ;; esac

  build:
    name: Build release artifacts
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            Makefile
      - name: Set up Fontspector
        uses: fonttools/setup-fontspector@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install build toolset
        run: |
          sudo apt-get update
          sudo apt-get install ttfautohint libcairo2-dev python3-cairo-dev pkg-config python3-dev
      - name: Set artifact file name
        run: echo "ZIP_NAME=${GITHUB_REPOSITORY#*/}-fonts" >> "$GITHUB_ENV"
      - name: Build fonts
        run: make build
      - name: Test built fonts
        run: |
          make test-scripts
          make check-mono-hmetrics
          make fontspector-release
          make check-language-shaping
      - name: Generate proofs
        run: make proof
      - name: Set up test result site
        run: cp scripts/index.html out/index.html
      - name: Collect deployment assets
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            fonts
            out
      - name: Archive npm release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: namche-shadow-font-fonts-npm
          path: |
            namche-shadow-font.zip
            packages/next/dist/fonts
  deploy:
    name: Deploy results to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release-npm:
    name: Release packages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download npm artifacts
        uses: actions/download-artifact@v8
        with:
          name: namche-shadow-font-fonts-npm
          path: ./artifacts
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install npm 11
        run: npm install -g npm@11.19.0
      - name: Install Corepack
        run: npm install -g corepack@0.35.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: packages/next
        run: pnpm install --frozen-lockfile
      - name: Move font files into the npm package
        run: |
          rm -rf packages/next/dist/fonts
          mv artifacts/packages/next/dist/fonts packages/next/dist/fonts
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2.1.1
        with:
          publish-script: pnpm run release
          version-script: pnpm run version
          cwd: packages/next
          pr-title: 'changesets: update versions of packages for release'
          commit-message: 'Version Packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload font zip to GitHub Release
        id: release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' packages/next/package.json)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          mv artifacts/namche-shadow-font.zip "namche-shadow-font-v$VERSION.zip"
          gh release upload "v$VERSION" "namche-shadow-font-v$VERSION.zip" --clobber

  publish-cdn:
    name: Publish release to CDN
    # Changesets creates release tags with GITHUB_TOKEN, which cannot trigger
    # another workflow run. Follow the publish result from the main run instead.
    needs: release-npm
    if: needs.release-npm.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Dispatch CDN publication
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-npm.outputs.tag }}
        run: |
          gh workflow run publish-cdn-release.yml \
            --repo NamcheAI/infra \
            --field publisher=namche-shadow-font \
            --field "tag=$TAG"

      - name: Verify CDN publication
        env:
          TAG: ${{ needs.release-npm.outputs.tag }}
        run: |
          set -euo pipefail
          index_url=https://cdn.namche.ai/fonts/namche-shadow/index.json
          release_url="https://cdn.namche.ai/fonts/namche-shadow/$TAG"

          for attempt in $(seq 1 30); do
            current=$(curl --fail --silent --show-error \
              "$index_url?tag=$TAG&attempt=$attempt" | jq -er '.current' 2>/dev/null || true)
            if [ "$current" = "$TAG" ] && \
              curl --fail --silent --show-error --output /dev/null \
                "$release_url/manifest.json" && \
              curl --fail --silent --show-error --output /dev/null \
                "$release_url/NamcheShadowSans/webfonts/NamcheShadowSans-Regular.woff2"; then
              echo "Verified CDN release $TAG"
              exit 0
            fi
            sleep 5
          done

          echo "::error::CDN index did not advance to $TAG"
          curl --fail --silent --show-error "$index_url?tag=$TAG&final=1" || true
          exit 1
