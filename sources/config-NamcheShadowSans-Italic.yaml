# Historical italic-only gftools config for the Namche Shadow Sans family.
#
# This config supported a one-off outline merge through
# scripts/refresh_sans_italic_outlines.py. The `make refresh-sans-italic-outlines`
# target was removed. Current release statics and VFs for both styles are built
# by `make build-sans` from the compatible equal-ink sources.
#
# Do not use this legacy config to update production release fonts.
sources:
  - NamcheShadowSans-Italic.glyphspackage
outputDir: ../out/sans-italic
familyName: "Namche Shadow Sans"
cleanUp: true
buildVariable: false
buildStatic: true
autohintOTF: true
